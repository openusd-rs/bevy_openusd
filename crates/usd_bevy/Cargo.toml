[package]
name = "usd_bevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Live OpenUSD editor for Bevy: stage projection, change-driven sync, authoring, persistence."
repository = "https://github.com/bresilla/bevy_openusd"

[dependencies]
usd_macro = { path = "../usd_macro" }
openusd = { git = "https://github.com/mxpv/openusd", rev = "b7df5add628cbb791103a7da842dbd82810da5d0" }
openusd-schemas = { git = "https://github.com/mxpv/openusd", rev = "b7df5add628cbb791103a7da842dbd82810da5d0", features = ["geom", "shade", "skel", "lux", "physics", "media", "vol", "render", "proc", "ui"] }
glam = "0.30"
anyhow = "1"
log = "0.4"
tempfile = "3"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
bevy = { version = "0.19.1", default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "morph",
    "bevy_camera",
    "bevy_image",
    "png",
    "jpeg",
    "hdr",
    "reflect_auto_register",
] }

[dev-dependencies]
png = "0.18"
