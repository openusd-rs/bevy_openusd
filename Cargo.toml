[workspace]
resolver = "2"
members = ["crates/usd_bevy", "crates/usd_macro"]
exclude = ["xtra", "vendor/openusd", "vendor/bevy_asset", "vendor/bevy_pbr"]

[profile.dev.package.openusd]
opt-level = 3

[profile.dev.package.usd_bevy]
opt-level = 3

[profile.dev.package.bevy_mesh]
opt-level = 3

[profile.dev.package.bevy_mikktspace]
opt-level = 3

[patch.crates-io]
bevy_asset = { path = "vendor/bevy_asset" }
bevy_pbr = { path = "vendor/bevy_pbr" }

[patch."https://github.com/mxpv/openusd"]
openusd = { path = "vendor/openusd/crates/openusd" }
openusd-build = { path = "vendor/openusd/crates/openusd-build" }
openusd-schemas = { path = "vendor/openusd/crates/openusd-schemas" }

[package]
name = "usdview"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Live OpenUSD editor — mara UI host embedding a Bevy viewport."
repository = "https://github.com/bresilla/bevy_openusd"

[[bin]]
name = "usdview"
path = "src/main.rs"

[features]
file_watcher = ["usd_bevy/file_watcher"]

[dependencies]
png = "0.18"
# The live USD editor: stage projection, sync, authoring, persistence.
usd_bevy = { path = "crates/usd_bevy" }
# Pure-Rust USD — the viewer opens the live `Stage` directly.
openusd = { git = "https://github.com/mxpv/openusd", rev = "b7df5add628cbb791103a7da842dbd82810da5d0" }
openusd-schemas = { git = "https://github.com/mxpv/openusd", rev = "b7df5add628cbb791103a7da842dbd82810da5d0", features = ["geom", "shade"] }

# mara — the egui UI host (window + ribbons/panes) embedding a Bevy viewport.
mara = { path = "../mara-bevy-host/mara", default-features = false, features = ["window", "bevy"] }
# Native "Open USD…" file picker.
rfd = "0.15"
# Detailed, filterable tracing to stderr (the embedded Bevy app has no
# LogPlugin, so without this the app's logs go nowhere).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bevy 0.19 (needs Rust 1.95+) — the embedded viewport renders the USD scene
# offscreen into a mara-provided render target.
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_anti_alias",
    "std",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_mesh",
    "bevy_camera",
    "bevy_image",
    "bevy_dev_tools",
    "reflect_auto_register",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
wgpu = { version = "29", default-features = false, features = ["vulkan"] }
egui-wgpu = { version = "0.34", default-features = false, features = ["winit"] }
