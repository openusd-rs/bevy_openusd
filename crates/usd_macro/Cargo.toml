[package]
name = "usd_macro"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The `usd!` inline-USD macro: compile-time-validated usda snippets for usd_bevy."
repository = "https://github.com/bresilla/bevy_openusd"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
# Used at macro-expansion time to validate the usda body (compile-time errors
# on malformed USD). The workspace `[patch]` redirects this to the local
# checkout, same as everywhere else.
openusd = { git = "https://github.com/mxpv/openusd", rev = "b7df5add628cbb791103a7da842dbd82810da5d0" }
