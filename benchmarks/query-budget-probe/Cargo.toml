[package]
name = "query_budget_probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
blake3 = "1"
bytemuck = "1"
serde_json = "1"
usd_bevy = { path = "../../crates/usd_bevy" }
openusd = { git = "https://github.com/mxpv/openusd", rev = "900ea31591348e3fbf416d4661d703aa8700771b" }
openusd-schemas = { git = "https://github.com/mxpv/openusd", rev = "900ea31591348e3fbf416d4661d703aa8700771b", features = ["skel"] }

[patch.crates-io]
bevy_asset = { path = "../../vendor/bevy_asset" }
bevy_pbr = { path = "../../vendor/bevy_pbr" }

[profile.dev.package.usd_bevy]
opt-level = 3

[profile.dev.package.openusd]
opt-level = 3

[profile.dev.package.openusd-schemas]
opt-level = 3
